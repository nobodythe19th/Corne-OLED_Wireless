# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# OLED display: show only the WPM Luna and Bongo Cat widgets.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_MINIMAL_LIBC=y
CONFIG_MINIMAL_LIBC_RAND=y
CONFIG_MINIMAL_LIBC_NON_REENTRANT_FUNCTIONS=y

CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_WIDGET_STATUS=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y=200
CONFIG_NICE_OLED_WIDGET_OUTPUT=y
CONFIG_NICE_OLED_WIDGET_LAYER=n
CONFIG_NICE_OLED_WIDGET_BATTERY=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n
CONFIG_NICE_OLED_WIDGET_RAW_HID=n
CONFIG_NICE_OLED_WIDGET_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_X=12
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_BONGO_CAT_CUSTOM_X=71
CONFIG_NICE_OLED_WIDGET_BONGO_CAT_CUSTOM_Y=-7
CONFIG_NICE_OLED_WIDGET_WPM_GAUGE_CUSTOM_X=2
CONFIG_NICE_OLED_WIDGET_WPM_GAUGE_CUSTOM_Y=70
CONFIG_NICE_OLED_WIDGET_WPM_NEEDLE_CENTER_CUSTOM_X=34
CONFIG_NICE_OLED_WIDGET_WPM_NEEDLE_CENTER_CUSTOM_Y=40
# The custom screen always draws the profile indicator; place it off-canvas.
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=200
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=200

# zmk studio
CONFIG_ZMK_STUDIO=y
